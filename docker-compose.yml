services:
  postgres:
    image: postgres:16
    container_name: newstrader-postgres
    environment:
      POSTGRES_USER: newstrader
      POSTGRES_PASSWORD: newstrader
      POSTGRES_DB: newstrader
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U newstrader']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
